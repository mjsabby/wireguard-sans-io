[package]
name = "wireguard-bench"
version = "0.0.0"
edition = "2024"
publish = false
description = "Comparative micro-benchmarks: wireguard-embed vs BoringTun (in-process), plus a UDP loopback harness usable against wireguard-go / kernel."

# This crate is its own workspace root (excluded from the parent) because
# it has a path dependency on a BoringTun checkout next to this repository
# (`../../boringtun` from here), which a plain checkout of this repository
# does not come with; CI clones it for the one job that builds this crate.
# Run with `cargo bench` from this directory.
[workspace]
members = ["."]

[dependencies]
wireguard-embed = { path = "../embed" }
wireguard-sans-io = { path = ".." }
wireguard-chacha-simd = { path = "../simd" }
boringtun = { path = "../../boringtun/boringtun", default-features = false }
# x25519-dalek is a transitive dep of boringtun; we need its types to
# construct boringtun::Tunn.
x25519-dalek = { version = "2.0.1", features = ["reusable_secrets", "static_secrets"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
# ring directly, for the ChaCha20 keystream reference line in the
# `chacha` benchmark (BoringTun doesn't re-export it).
ring = "0.17"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

# The release profile of the repository's workspace: this crate is a
# workspace of its own, and would otherwise measure cargo's defaults (no
# link-time optimisation, sixteen codegen units) — not the build the
# other numbers in this repository come from.
[profile.release]
lto = "thin"
codegen-units = 1

# Warnings are errors in this crate's own code. Said here and not with
# RUSTFLAGS, which would apply to the BoringTun path dependency as well:
# warnings about a path dependency are not capped as a registry crate's
# are, and BoringTun's are BoringTun's.
[lints.rust]
warnings = "deny"

[[bench]]
name = "compare"
harness = false

[[bench]]
name = "chacha"
harness = false

[[bin]]
name = "udp_throughput"
path = "src/udp_throughput.rs"
