[package]
name = "wireguard-sans-io"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A sans-I/O, no_std, zero-allocation, zero-dependency, panic-free WireGuard protocol implementation"
keywords = ["wireguard", "noise", "sans-io", "no-std", "vpn"]
categories = ["network-programming", "cryptography", "no-std", "no-std::no-alloc"]
repository = "https://github.com/mjsabby/wireguard-sans-io"
readme = "README.md"
# A published package is the library with its tests and examples and the
# two documents. What drives the rest of the repository stays there: the
# CI workflow, the scripts (they need the other crates, a kernel, qemu)
# and the build configuration.
exclude = [".github/", ".cargo/", "scripts/", ".gitignore"]

# Workspace: the no_std core (this package) plus the std-driving wrapper
# and the SIMD backends. The fuzz harness, the comparative benchmark
# crate and the audit harness are excluded so their out-of-tree
# dependencies (nightly + libfuzzer for fuzz; a sibling `../../boringtun`
# path checkout for bench; the reference implementations audit compares
# with) cannot break library builds or CI workspace resolution.
[workspace]
members = ["embed", "simd"]
exclude = ["fuzz", "bench", "audit"]

[features]
default = ["x25519-table"]
# Key generation (the public key of a private key, once per handshake
# message) with a ladder made for the base point: about 40 % cheaper than
# the general one, for 10 KiB of constants. Constant time either way.
# Leave it out where 10 KiB of flash matter more.
x25519-table = []

[dependencies]
# none, ever. The entire implementation (including all cryptography) is
# in-tree, `#![forbid(unsafe_code)]`, no_std and allocation-free.

[dev-dependencies]
# none. Tests are self-contained and fully deterministic.

# Light optimization for dev/test: keeps overflow checks and debug
# assertions (both load-bearing for the test suite) while making the
# in-tree crypto fast enough for the property-test and protocol-fuzz suites.
[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

# `cargo build --profile profiling` produces optimized code with full debug
# info for `perf record` / flamegraphs.
[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unused_must_use = "deny"

[lints.clippy]
# ---- panic-freedom wall -------------------------------------------------
# The library must never panic. Any potential panic site must be rewritten
# in terms of total operations (checked/wrapping arithmetic, fallible
# slicing) or carry a narrowly-scoped `#[allow]` with a PANIC-FREEDOM proof
# comment.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
modulo_one = "deny"
exit = "deny"
# The slice methods that carry a panic (`clippy.toml` lists them) are an
# error in the library — `src/lib.rs` says so, where it applies — and
# allowed in its tests and examples, which is what this line is for.
disallowed_methods = "allow"
# ---- general hygiene ----------------------------------------------------
mem_forget = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
must_use_candidate = "warn"
missing_errors_doc = "warn"
